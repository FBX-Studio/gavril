server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite builds hashed assets under /assets; cache them aggressively
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for react-router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
